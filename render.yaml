services:
  - type: web
    name: zotoz-capture
    env: node
    plan: free
    region: singapore
    buildCommand: npm run install:all && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
